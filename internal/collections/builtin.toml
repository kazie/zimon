# zimon's built-in collections.
#
# Tiers: a level includes core (light), core+more (standard) or
# core+more+deep (deep). Giants are never added by a level; each is an
# explicit opt-in (`zimon level <name> on`).
#
# {lang} expands to each configured language's two-letter code (English if
# none of them has the ZIM); {region} to the region set in library.toml.
# Every name is checked against the live catalog by `just check-collections`.

[[collection]]
id = "essentials"
title = "Essentials"
blurb = "General knowledge: encyclopedia, dictionary, travel guide, repair manuals."
core = [
  { name = "wikipedia_{lang}_all", note = "All of Wikipedia in your languages" },
  { name = "wiktionary_{lang}_all", note = "Dictionary with etymology and translations" },
  { name = "wikivoyage_{lang}_all", note = "Travel guide, small and practical" },
]
more = [
  { name = "wikipedia_en_medicine", note = "WikiMed: Wikipedia's medical articles in one compact ZIM" },
  { name = "ifixit_{lang}_all", note = "Step-by-step repair guides for thousands of devices" },
  { name = "theworldfactbook_en_all", note = "CIA World Factbook: every country at a glance" },
]

