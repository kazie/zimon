<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zimon admin</title>
<link rel="stylesheet" href="/_zimon/portal.css">
<link rel="stylesheet" href="/_zimon/admin.css">
<script src="/_zimon/admin.js" defer></script>
</head>
<body>
<header>
  <h1><a href="/">zimon</a></h1>
  <nav class="actions">
    <button id="apply" title="Make the disk match library.toml">Apply library.toml…</button>
    <button id="update" title="Fetch newer releases">Update now</button>
    <form method="post" action="/admin/logout"><button>Sign out</button></form>
  </nav>
</header>
<p class="problem" id="problem" hidden></p>
<p class="problem" id="no-catalog" hidden>There is no Kiwix catalog here yet, so sizes show as 0 B and the
  Catalog tab is empty. <span id="catalog-fetching">zimon serve is fetching it (see Jobs).</span>
  <span id="catalog-failed">zimon serve tries again later, or now:
  <button id="refresh">Fetch the catalog</button></span></p>
<main>
  <section>
    <h2>Disk</h2>
    <div id="disk" class="disk"></div>
  </section>
  <section>
    <h2>Jobs</h2>
    <ul id="jobs" class="jobs"></ul>
  </section>
  <nav class="tabs" role="tablist" aria-label="What to show">
    <button role="tab" data-tab="collections">Collections</button>
    <button role="tab" data-tab="zims">Your ZIMs</button>
    <button role="tab" data-tab="catalog">Catalog</button>
  </nav>
  <section role="tabpanel" id="tab-collections">
    <p class="blurb">Pick how deep each interest goes. Every change shows its plan first.</p>
    <ul id="collections" class="cols"></ul>
  </section>
  <section role="tabpanel" id="tab-zims" hidden>
    <table id="items" class="items"></table>
  </section>
  <section role="tabpanel" id="tab-catalog" hidden>
    <input id="filter" class="filter" type="search" autocomplete="off"
      placeholder="Filter by name, title or topic, e.g. wikipedia, cooking, python" aria-label="Filter the catalog">
    <p id="found" class="note"></p>
    <div class="scroll"><table id="results" class="items"></table></div>
    <p id="more-row" hidden><button id="more">Show more</button> <span id="more-note" class="note"></span></p>
  </section>
</main>
<dialog id="plan">
  <h2 id="plan-title"></h2>
  <div id="plan-body"></div>
  <form method="dialog" class="buttons">
    <button value="cancel">Cancel</button>
    <button value="ok" id="plan-ok">Go ahead</button>
  </form>
</dialog>
<footer>{{template "build" .}}</footer>
</body>
</html>
