name: Collections

# Kiwix renames and retires ZIMs now and then. Check every built-in
# collection item against the live catalog once a week, so a rename shows up
# here instead of as a silently shorter collection.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # the cache key is shared; let the CI test job fill it
      - run: go run ./tools/checkcollections
