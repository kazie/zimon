name: Nix

# The flake, checked when what it depends on changes: its vendorHash goes
# stale with every go.mod change, and nothing else in CI uses Nix. flake check
# builds and tests the package in the Nix sandbox, and evaluates the dev shell
# without downloading it.
on:
  push:
    branches: [master]
    paths: [go.mod, go.sum, flake.nix, flake.lock]
  pull_request:
    paths: [go.mod, go.sum, flake.nix, flake.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
