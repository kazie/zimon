name: Fuzz

# Every fuzz target for a minute, once a week. A crash fails the run, and the
# input that caused it is attached as an artifact: put it in that package's
# testdata/fuzz/<target>/ so plain `go test` keeps checking it.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # the cache key is shared; let the CI test job fill it
      - name: Fuzz
        run: bash tools/fuzz.sh 1m
      - name: Collect crashing inputs
        if: failure()
        # The new files under testdata/fuzz, with their paths.
        run: |
          mkdir crashers
          git ls-files --others --exclude-standard -z -- '*/testdata/fuzz/*' | xargs -0 -r cp --parents -t crashers
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: crashers
