# zimon behind nginx with HTTPS. zimon listens on 127.0.0.1:8080 for books
# and 127.0.0.1:8081 for the admin page (the container's published ports, or
# `zimon serve`'s defaults). nginx serves zim.example.org (books) and
# zim-admin.example.org (the admin page) to the world: two host names, so
# books and the admin page never share an origin.
#
# Get the certificates before enabling this file (nginx refuses to load it
# without them), for example with nginx stopped:
#   certbot certonly --standalone -d zim.example.org -d zim-admin.example.org
# That makes one certificate for both names, the one used below.

server {
    listen 80;
    listen [::]:80;
    server_name zim.example.org zim-admin.example.org;
    return 301 https://$host$request_uri;
}

# Books, the start page and the API (with a token).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zim.example.org;

    ssl_certificate     /etc/letsencrypt/live/zim.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zim.example.org/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # zimon limits wrong tokens per address, and reads it from here.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Live job events: pass each one on at once, and keep the stream open.
    location /api/v1/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# The admin page. Its session cookie is Secure because of X-Forwarded-Proto.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zim-admin.example.org;

    ssl_certificate     /etc/letsencrypt/live/zim.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zim.example.org/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    location /api/v1/events {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
