# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: zimon

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for sh in bash fish zsh; do go run . completion "$sh" > "completions/zimon.$sh"; done'
    - sh -c 'mkdir -p manpages && SOURCE_DATE_EPOCH={{ .CommitTimestamp }} go run . man > manpages/zimon.1'

builds:
  - main: .
    binary: zimon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - completions/*
      - manpages/*
      - contrib/systemd/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github # each line links its commit and @author
  sort: asc
  abbrev: 7
  filters:
    # Allowlist: only release-relevant Conventional Commit types reach the
    # notes, which drops merge commits, docs/test/chore/style and anything
    # that is not a Conventional Commit.
    include:
      - '^(feat|fix|perf|refactor|build|ci|revert)(\([^)]*\))?!?:'
  groups:
    - title: Breaking changes
      regexp: '^.*?[a-z]+(\([^)]*\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([^)]*\))?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([^)]*\))?:.+$'
      order: 3
    - title: Dependencies
      regexp: '^.*?build\(deps\):.+$'
      order: 4
    - title: Build, CI and other changes
      order: 999
